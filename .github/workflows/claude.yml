# Ad-hoc help: mention @claude in an issue/PR comment, e.g.
#   "@claude แก้ตาม review ข้อ 2 ให้หน่อย"   "@claude อธิบายว่าทำไม test นี้ fail"
# Only repo members can trigger it.
name: Claude (@mention)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      (contains(github.event.comment.body, '@claude') || contains(github.event.review.body, '@claude')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.comment.author_association || github.event.review.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Snapshot CI helpers
        # Copied before Claude runs, so Claude's file edits cannot change the scripts that
        # later steps run. (Code Claude may run, e.g. pnpm test, is not covered by this.)
        run: cp scripts/show-claude-error.sh scripts/check-review-posted.sh "$RUNNER_TEMP/"
      - uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        id: claude
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"   # subagents must finish before the run ends; in CI the process exits with the main turn
        with:
          # Either secret works: a Console API key (billed per token) or a Claude
          # subscription token from `claude setup-token` (Pro/Max/Team/Enterprise).
          # Set only one: if both are set, the API key wins and is billed.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Task,Agent,Bash(git add:*),Bash(git commit:*),Bash(git push origin ai/*),Bash(git diff:*),Bash(git log:*),Bash(git status:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(pnpm lint:*),Bash(pnpm typecheck:*),Bash(pnpm test:*),Bash(pnpm build:*)"
      - name: Show Claude errors and denied tools
        # claude-code-action hides Claude's output; this prints only errors and denied
        # tool calls (a denied tool can make a "successful" run silently do nothing).
        if: always() && steps.claude.outcome != 'skipped' && steps.claude.outcome != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: bash "$RUNNER_TEMP/show-claude-error.sh" "$EXEC_FILE" "$CLAUDE_OUTCOME"
