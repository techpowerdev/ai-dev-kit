# Gate 3 support: deploy every PR to a preview URL, then let the QA agent test it
# and post a report telling the human which 3 flows to try.
name: Preview + AI QA

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  deployments: write
  actions: read

jobs:
  deploy-preview:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # TODO: implement scripts/deploy.sh for your host (Vercel / Railway / Render / Fly / k8s ...)
      # It must print "url=<preview-url>" to $GITHUB_OUTPUT.
      - id: deploy
        run: ./scripts/deploy.sh preview "pr-${{ github.event.pull_request.number }}"
        env:
          DEPLOY_TOKEN: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}

  ai-qa:
    needs: deploy-preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        env:
          BASE_URL: ${{ needs.deploy-preview.outputs.url }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/qa ${{ github.event.pull_request.number }} ${{ needs.deploy-preview.outputs.url }}"
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Write,Glob,Grep,Task,Agent,Bash(pnpm test:e2e:*),Bash(pnpm exec playwright:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
