# Gate 3 support: deploy every PR to a preview URL, then let the QA agent test it
# and post a report telling the human which 3 flows to try.
#
# Called from ci.yml only after lint · typecheck · test · build passes, so a broken PR
# is never deployed or QA'd. ci.yml's concurrency group cancels an in-flight run when a
# new commit is pushed. Permissions are granted by the caller job.
name: Preview + AI QA

on:
  workflow_call:
    inputs:
      pr_number:
        type: number
        required: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      configured: ${{ steps.deploy.outputs.configured }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # TODO: implement scripts/deploy.sh for your host (Vercel / Railway / Render / Fly / k8s ...)
      # It must print "url=<preview-url>" to $GITHUB_OUTPUT. The placeholder also prints
      # "configured=false", which skips AI QA so it never tests a fake URL.
      - id: deploy
        run: ./scripts/deploy.sh preview "pr-${{ inputs.pr_number }}"
        env:
          DEPLOY_TOKEN: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}

  ai-qa:
    needs: deploy-preview
    if: needs.deploy-preview.outputs.configured != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Lets the job skip cleanly (with a warning) instead of failing when no Claude credential is set yet.
      HAS_CLAUDE_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - if: env.HAS_CLAUDE_AUTH != 'true'
        run: echo "::warning::No Claude credential — skipping AI QA. Set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN (see README-AI-SETUP.md)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }   # Claude never pushes here; keep the token out of .git/config
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - if: env.HAS_CLAUDE_AUTH == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Snapshot CI helpers
        # Copied before Claude runs, so Claude cannot change the scripts that later steps run.
        run: cp scripts/show-claude-error.sh scripts/check-review-posted.sh "$RUNNER_TEMP/"
      - if: env.HAS_CLAUDE_AUTH == 'true'
        id: claude
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"   # subagents must finish before the run ends; in CI the process exits with the main turn
          BASE_URL: ${{ needs.deploy-preview.outputs.url }}
        with:
          # Either secret works: a Console API key (billed per token) or a Claude
          # subscription token from `claude setup-token` (Pro/Max/Team/Enterprise).
          # Set only one: if both are set, the API key wins and is billed.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/qa ${{ inputs.pr_number }} ${{ needs.deploy-preview.outputs.url }}"
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Write,Glob,Grep,Task,Agent,Bash(pnpm test:e2e:*),Bash(pnpm exec playwright:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
      - name: Show Claude errors and denied tools
        # claude-code-action hides Claude's output; this prints only errors and denied
        # tool calls (a denied tool can make a "successful" run silently do nothing).
        if: always() && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure')
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: bash "$RUNNER_TEMP/show-claude-error.sh" "$EXEC_FILE"
