# Every PR gets an AI code review (+ security review on high-risk paths)
# BEFORE a human looks at it. The human then reads the "👀 please look closely at" list.
#
# Called from ci.yml only after lint · typecheck · test · build passes, so no tokens are
# spent reviewing code that does not compile. ci.yml's concurrency group cancels an
# in-flight review when a new commit is pushed. Permissions are granted by the caller job.
name: AI review

on:
  workflow_call:
    inputs:
      pr_number:
        type: number
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Lets the job skip cleanly (with a warning) instead of failing when no Claude credential is set yet.
      HAS_CLAUDE_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - if: env.HAS_CLAUDE_AUTH != 'true'
        run: echo "::warning::No Claude credential — skipping AI review. Set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN (see README-AI-SETUP.md)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - if: env.HAS_CLAUDE_AUTH == 'true'
        id: claude
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          # Either secret works: a Console API key (billed per token) or a Claude
          # subscription token from `claude setup-token` (Pro/Max/Team/Enterprise).
          # Set only one: if both are set, the API key wins and is billed.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/review ${{ inputs.pr_number }}"
          claude_args: >-
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Task,Agent,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr checkout:*)"
      - name: Show Claude errors and denied tools
        # claude-code-action hides Claude's output; this prints only errors and denied
        # tool calls (a denied tool can make a "successful" run silently do nothing).
        if: always() && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure')
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: bash scripts/show-claude-error.sh "$EXEC_FILE"
