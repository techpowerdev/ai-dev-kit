# Every PR gets an AI code review (+ security review on high-risk paths)
# BEFORE a human looks at it. The human then reads the "👀 please look closely at" list.
#
# Called from ci.yml only after lint · typecheck · test · build passes, so no tokens are
# spent reviewing code that does not compile. ci.yml's concurrency group cancels an
# in-flight review when a new commit is pushed. Permissions are granted by the caller job.
name: AI review

on:
  workflow_call:
    inputs:
      pr_number:
        type: number
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Lets the job skip cleanly (with a warning) instead of failing when the key is not set yet.
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - if: env.HAS_ANTHROPIC_KEY != 'true'
        run: echo "::warning::ANTHROPIC_API_KEY is not set — skipping AI review. Add it with gh secret set ANTHROPIC_API_KEY."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - if: env.HAS_ANTHROPIC_KEY == 'true'
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/review ${{ inputs.pr_number }}"
          claude_args: >-
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Task,Agent,Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr checkout:*)"
