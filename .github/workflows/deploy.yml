# main → staging (auto) → smoke test → 👤 Gate 4: human approves "production" environment
# → production → AI post-deploy health report.
# Rollback: Actions → Deploy → Run workflow → target=production, ref=<previous tag or sha>.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "staging or production"
        required: true
        default: production
        type: choice
        options: [staging, production]
      ref:
        description: "Git ref to deploy (tag/sha) — use for rollback"
        required: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  id-token: write
  issues: write
  pull-requests: read
  actions: read

jobs:
  staging:
    if: github.event_name == 'push' || inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      configured: ${{ steps.deploy.outputs.configured }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref || github.sha }}" }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: deploy
        run: ./scripts/deploy.sh staging "${{ inputs.ref || github.sha }}"
        env:
          DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}

  smoke-staging:
    needs: staging
    # Placeholder deploy.sh reports configured=false: there is nothing to smoke-test, and
    # because production requires this job to succeed, production is skipped too.
    if: needs.staging.outputs.configured != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --grep @smoke
        env:
          BASE_URL: ${{ needs.staging.outputs.url }}

  production:
    # Push path: waits for staging smoke. Manual path (rollback): goes straight here.
    needs: [smoke-staging]
    if: |
      always() &&
      ((github.event_name == 'push' && needs.smoke-staging.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'production'))
    runs-on: ubuntu-latest
    # 👤 GATE 4 — "production" environment has Required reviewers (set by scripts/setup-github.sh).
    # The job pauses here until a human clicks "Approve and deploy".
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      configured: ${{ steps.deploy.outputs.configured }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref || github.sha }}" }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: deploy
        run: ./scripts/deploy.sh production "${{ inputs.ref || github.sha }}"
        env:
          DEPLOY_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_TOKEN }}
      - name: Production smoke test
        if: steps.deploy.outputs.configured != 'false'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e --grep @smoke-prod
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}

  post-deploy-report:
    needs: production
    if: needs.production.result == 'success' && needs.production.outputs.configured != 'false'
    runs-on: ubuntu-latest
    env:
      # Lets the job skip cleanly (with a warning) instead of failing when no Claude credential is set yet.
      HAS_CLAUDE_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    # Waits for 30 min of real traffic before judging. The delay comes from the
    # "post-deploy-report" environment's wait timer (set by scripts/setup-github.sh),
    # so no runner is held — unlike a `sleep` step, waiting costs no Actions minutes.
    # If that environment is missing, GitHub creates it with no timer and this runs immediately.
    environment: post-deploy-report
    steps:
      - if: env.HAS_CLAUDE_AUTH != 'true'
        run: echo "::warning::No Claude credential — skipping the post-deploy report. Set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN (see README-AI-SETUP.md)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Snapshot CI helpers
        # Copied before Claude runs, so Claude's file edits cannot change the scripts that
        # later steps run. (Code Claude may run, e.g. pnpm test, is not covered by this.)
        run: cp scripts/show-claude-error.sh scripts/check-review-posted.sh "$RUNNER_TEMP/"
      - if: env.HAS_CLAUDE_AUTH == 'true'
        id: claude
        uses: anthropics/claude-code-action@db77d4d3c98f3f6380e7cd45ffba2342a3dbde3c # v1.0.254
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"   # subagents must finish before the run ends; in CI the process exits with the main turn
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_READ_TOKEN }}   # TODO: read-only token for your monitoring
        with:
          # Either secret works: a Console API key (billed per token) or a Claude
          # subscription token from `claude setup-token` (Pro/Max/Team/Enterprise).
          # Set only one: if both are set, the API key wins and is billed.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Use the ops-monitor agent. A production deploy of ${{ inputs.ref || github.sha }} finished about 30 minutes ago.
            Compare health before vs after (see docs/ai-workflow.md "Monitoring sources").
            Open a GitHub issue titled "Post-deploy report ${{ inputs.ref || github.sha }}" with the report and label it
            "deploy-report" plus "incident" if status is 🔴. Never roll back yourself.
          claude_args: >-
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Task,Agent,WebFetch,Bash(git log:*),Bash(gh pr list:*),Bash(gh issue create:*),Bash(curl -s:*)"
      - name: Show Claude errors and denied tools
        # claude-code-action hides Claude's output; this prints only errors and denied
        # tool calls (a denied tool can make a "successful" run silently do nothing).
        if: always() && steps.claude.outcome != 'skipped' && steps.claude.outcome != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: bash "$RUNNER_TEMP/show-claude-error.sh" "$EXEC_FILE"
