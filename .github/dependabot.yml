# Keeps the SHA-pinned actions in .github/workflows up to date.
# Dependabot updates both the SHA and the "# vX.Y.Z" comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]

